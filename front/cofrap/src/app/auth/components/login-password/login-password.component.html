<div class="flex flex-col items-center justify-center" style="width: 40vw;">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
        <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
            <app-welcome-card title="Connexion" subtitle="Connectez-vous pour continuer" color="var(--primary-color)"></app-welcome-card>

            <!-- Message Error -->
            @for (item of message; track $index) {
                <p-message closable styleClass="mt-2 mb-6" [severity]="item.severity"> {{ item.text }} </p-message>
            }

            <div>
                <label for="username" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Nom d'utilisateur</label>
                <input pInputText id="username" type="text" placeholder="Entrez votre nom d'utilisateur" class="w-full md:w-[30rem] mb-6" [(ngModel)]="username" />

                <label for="password1" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">Mot de passe</label>
                <p-password id="password1" [(ngModel)]="password" placeholder="Entrez votre mot de passe" [toggleMask]="true" styleClass="mb-8" [fluid]="true" [feedback]="false"></p-password>

                <p-button label="Connexion" styleClass="w-full" (onClick)="onVerifyPassword()" [disabled]="loading || !username || !password" [loading]="loading"></p-button>
            </div>

            <div class="flex items-center justify-center mt-8 gap-2">
                Pas encore de compte ?
                <a class="text-primary font-medium no-underline ml-2 text-right cursor-pointer" routerLink="/auth/register">Créer un compte</a>
            </div>
        </div>
    </div>
</div>
