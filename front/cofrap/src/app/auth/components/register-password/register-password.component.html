<div class="flex flex-col items-center justify-center" style="width: 40vw;" >
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, rgba(247, 149, 48, 0.4) 10%, rgba(247, 149, 48, 0) 30%)">
        <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">

            <!-- Title -->
            @if (!showMfaStep) {
                <app-welcome-card title="Créer un compte" subtitle="Entrez votre nom d'utilisateur pour générer un mot de passe sécurisé." color="rgb(249 115 22 / var(--tw-bg-opacity, 1))"></app-welcome-card>
            } @else {
                <app-welcome-card title="Compte en cours de création" subtitle="" color="rgb(249 115 22 / var(--tw-bg-opacity, 1))"></app-welcome-card>
            }

            <!-- Message Error -->
            @for (item of message; track $index) {
                <p-message closable styleClass="mt-2 mb-6" [severity]="item.severity"> {{ item.text }} </p-message>
            }

            <!-- Register  -->
            @if (!showMfaStep) {
                <div>
                    <label for="username" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">Nom d'utilisateur</label>
                    <input pInputText id="username" type="text" placeholder="Entrez votre nom d'utilisateur" class="w-full md:w-[30rem] mb-8" [(ngModel)]="username" />

                    <p-button label="Génerer le mot de passe" severity="warn" styleClass="w-full mt-6" [loading]="loading" [disabled]="loading" (onClick)="generatePassword()"></p-button>
                </div>

                <div class="flex items-center justify-center mt-8 gap-2">
                    Vous avez déjà un compte ?
                    <a class="font-medium no-underline ml-2 text-right cursor-pointer text-orange-500" routerLink="/auth/login">Se connecter</a>
                </div>
            } @else {
                <!-- Next step MFA -->
                @if (qrCode) {
                    <div class="text-center">
                        <img [src]="qrCode | appBase64ToImage" alt="QR Code" class="mb-4 w-60 h-60 mx-auto" />
                    </div>
                }

                <!-- Info Message -->
                <p-message styleClass="my-6 md:w-[30rem]" severity="info" icon="pi pi-send" text="Assurez-vous d’avoir bien stocké le QR code. Vous pouvez maintenant passer à l'étape suivante." />

                <p-confirmpopup />
                <button pButton label="Générer le MFA" severity="warn" class="w-full" (click)="onConfirmMfaStep($event)"></button>
            }
        </div>
    </div>
</div>
