<div class="flex flex-col items-center justify-center" style="width: 40vw;">
    <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
        <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
            <app-welcome-card title="Vérification OTP" subtitle="Entre le code de ton application d'authentification."></app-welcome-card>

            <!-- Message Error -->
            @for (item of message; track $index) {
                <p-message closable styleClass="mt-2 mb-6" [severity]="item.severity"> {{ item.text }} </p-message>
            }

            <div>
                <p-inputotp [(ngModel)]="otpValue" [length]="6" [autofocus]="true">
                    <ng-template #input let-token let-events="events" let-index="index">
                        <input type="text" [maxLength]="1" (input)="events.input($event)" (keydown)="events.keydown($event)" [attr.value]="token" class="custom-otp-input" />
                        <div *ngIf="index === 3" class="px-4">
                            <i class="pi pi-minus"></i>
                        </div>
                    </ng-template>
                </p-inputotp>

                <div class="flex items-center mt-8 gap-4">
                    <div class="flex-1">
                        <p-button label="Annuler" severity="secondary" styleClass="w-full flex-1" [disabled]="loading" (onClick)="onCancelOtp()"></p-button>
                    </div>
                    <div class="flex-1">
                        <p-button label="Verifier" styleClass="w-full flex-1" [disabled]="otpValue.length < 6" [loading]="loading" (onClick)="onVerifyOtp()"></p-button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<p-toast />
